<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justifty-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
            margin: 0;
        }

        .card {
            margin: auto;
            width: 652px;
            height: 452px;
            padding: 14px;

        }

        .title {
            font-size: 13px;
            font-weight: 400;

            text-decoration-color: #a87557;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .news-list {
            display: grid;
            /* grid: 210px auto auto; */
            grid-template-columns: 33% 33% 33%;
            grid-template-rows: auto auto auto;
            gap: 5px;
            grid-row-gap: 21px;
        }


        .news {
            width: 210px;
            /* display: row; */
        }

        .news img {
            width: 210px;
            height: auto;
            margin-top: 6px;
        }

        .news p {
            font-size: 12px;
            letter-spacing: 1.3px;
            line-height: 1.5;

            margin-top: 0;
            margin-left: 6px;
            margin-right: 8px;

            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;

        }
    </style>
